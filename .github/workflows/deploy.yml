name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Fired by cs50x-journey's own workflow whenever progress.json changes there,
  # so the CS50x project page's progress bar/reflections stay current without
  # a manual rebuild here. See _data/cs50x.js for the actual fetch.
  repository_dispatch:
    types: [cs50x-updated]

# Least privilege: the build job (which runs npm install scripts) only reads;
# only the deploy job can publish.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Full history: each page's sitemap <lastmod> is its file's last commit
          # (content/content.11tydata.js); a shallow clone would stamp them all
          # with the same date.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix app
      - run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      # Tells Bing (and every engine built on its index: Ecosia, DuckDuckGo,
      # Yahoo, Qwant) that the site changed, instead of waiting for its next
      # crawl. The key lives in content/indexnow-key.njk, served at
      # /indexnow-key.txt. Never fails the deploy.
      - name: Notify IndexNow
        continue-on-error: true
        run: |
          SITE=https://ruben-gariazzo.fr
          KEY=$(curl -fsS "$SITE/indexnow-key.txt" | tr -d '[:space:]')
          URLS=$(curl -fsS "$SITE/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed -e 's/<loc>//' -e 's/<\/loc>//' | jq -R . | jq -sc .)
          jq -n --arg key "$KEY" --argjson urls "$URLS" --arg loc "$SITE/indexnow-key.txt" \
            '{host: "ruben-gariazzo.fr", key: $key, keyLocation: $loc, urlList: $urls}' \
            | curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST \
                -H "Content-Type: application/json; charset=utf-8" --data @- https://api.indexnow.org/indexnow
