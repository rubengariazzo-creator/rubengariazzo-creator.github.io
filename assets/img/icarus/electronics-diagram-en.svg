<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 345" width="1200" height="345" role="img" aria-label="Diagram of Icarus's electronics block" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Diagram of Icarus's electronics block</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5cc4cc"/></marker></defs>
<rect x="25" y="30" width="190" height="235" rx="10" fill="#14171c" stroke="#2c333d" stroke-width="1.5"/>
