<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-label="Diagram of Icarus's electronics block" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Diagram of Icarus's electronics block</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e9c186"/></marker></defs>
<rect x="15" y="30" width="255" height="260" rx="10" fill="#14171c" stroke="#2c333d" stroke-width="1.5"/>
<circle cx="39" cy="57" r="13" fill="#c4903f"/>
<text x="39" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#0a0c0f">1</text>
<text x="61" y="63" font-size="17" font-weight="700" fill="#edeff2">On the rail</text>
<circle cx="53" cy="108" r="13" fill="#ff5a5a" opacity="0.22"/><circle cx="53" cy="108" r="8" fill="#ff5a5a"/>
<circle cx="91" cy="108" r="8" fill="none" stroke="#4a525d" stroke-width="2"/>
<circle cx="129" cy="108" r="8" fill="none" stroke="#4a525d" stroke-width="2"/>
<text x="31" y="160" font-size="14.5" fill="#adb3bc">Jack plug connected</text>
<text x="31" y="184" font-size="14.5" fill="#adb3bc">Red LED on</text>
<text x="31" y="208" font-size="14.5" fill="#adb3bc">Timer on standby</text>
<line x1="276" y1="160.0" x2="312" y2="160.0" stroke="#e9c186" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="320" y="30" width="255" height="260" rx="10" fill="#14171c" stroke="#2c333d" stroke-width="1.5"/>
<circle cx="344" cy="57" r="13" fill="#c4903f"/>
<text x="344" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#0a0c0f">2</text>
<text x="366" y="63" font-size="17" font-weight="700" fill="#edeff2">Liftoff</text>
<circle cx="358" cy="108" r="8" fill="none" stroke="#4a525d" stroke-width="2"/>
<circle cx="396" cy="108" r="13" fill="none" stroke="#5a9bff" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.8"/><circle cx="396" cy="108" r="8" fill="#5a9bff"/>
<circle cx="434" cy="108" r="8" fill="none" stroke="#4a525d" stroke-width="2"/>
<text x="336" y="160" font-size="14.5" fill="#adb3bc">Jack plug pulled out</text>
<text x="336" y="184" font-size="14.5" fill="#adb3bc">Red LED off</text>
<text x="336" y="208" font-size="14.5" fill="#adb3bc">Blue LED blinking</text>
<text x="336" y="232" font-size="14.5" fill="#adb3bc">The countdown starts</text>
<line x1="581" y1="160.0" x2="617" y2="160.0" stroke="#e9c186" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="625" y="30" width="255" height="260" rx="10" fill="#14171c" stroke="#2c333d" stroke-width="1.5"/>
<circle cx="649" cy="57" r="13" fill="#c4903f"/>
<text x="649" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#0a0c0f">3</text>
<text x="671" y="63" font-size="17" font-weight="700" fill="#edeff2">Ascent</text>
<circle cx="663" cy="108" r="8" fill="none" stroke="#4a525d" stroke-width="2"/>
<circle cx="701" cy="108" r="13" fill="none" stroke="#5a9bff" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.8"/><circle cx="701" cy="108" r="8" fill="#5a9bff"/>
<circle cx="739" cy="108" r="8" fill="none" stroke="#4a525d" stroke-width="2"/>
<text x="641" y="160" font-size="14.5" fill="#adb3bc">Countdown set from the</text>
<text x="641" y="184" font-size="14.5" fill="#adb3bc">StabTraj simulations</text>
<text x="641" y="208" font-size="14.5" fill="#adb3bc">Ends just after</text>
<text x="641" y="232" font-size="14.5" fill="#adb3bc">apogee (230 m, 6.7 s)</text>
<line x1="886" y1="160.0" x2="922" y2="160.0" stroke="#e9c186" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="930" y="30" width="255" height="260" rx="10" fill="#14171c" stroke="#2c333d" stroke-width="1.5"/>
<circle cx="954" cy="57" r="13" fill="#c4903f"/>
<text x="954" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#0a0c0f">4</text>
<text x="976" y="63" font-size="17" font-weight="700" fill="#edeff2">Deployment</text>
<circle cx="968" cy="108" r="8" fill="none" stroke="#4a525d" stroke-width="2"/>
<circle cx="1006" cy="108" r="8" fill="none" stroke="#4a525d" stroke-width="2"/>
<circle cx="1044" cy="108" r="13" fill="#3ddc84" opacity="0.22"/><circle cx="1044" cy="108" r="8" fill="#3ddc84"/>
<text x="946" y="160" font-size="14.5" fill="#adb3bc">The servo turns and releases</text>
<text x="946" y="184" font-size="14.5" fill="#adb3bc">a tensioned spring that pushes</text>
<text x="946" y="208" font-size="14.5" fill="#adb3bc">the hatch: parachute out</text>
<text x="946" y="232" font-size="14.5" fill="#adb3bc">Blue LED off</text>
<text x="946" y="256" font-size="14.5" fill="#adb3bc">Green LED on</text>
<rect x="15" y="316" width="1170" height="40" rx="8" fill="none" stroke="#2c333d" stroke-width="1.5"/>
<text x="600" y="341" text-anchor="middle" font-size="15" fill="#edeff2">5 V battery  ·  Arduino Nano board (timer)  ·  Servo and 3 LEDs</text>
</svg>