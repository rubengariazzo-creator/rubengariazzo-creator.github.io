<circle cx="1023" cy="108" r="8" fill="none" stroke="#4a525d" stroke-width="2"/>
<circle cx="1061" cy="108" r="8" fill="none" stroke="#4a525d" stroke-width="2"/>
<circle cx="1099" cy="108" r="13" fill="#3ddc84" opacity="0.22"/><circle cx="1099" cy="108" r="8" fill="#3ddc84"/>
<text x="1001" y="160" font-size="13.5" fill="#adb3bc">Blue LED off</text>
<text x="1001" y="184" font-size="13.5" fill="#adb3bc">Green LED on</text>
<text x="1001" y="208" font-size="13.5" fill="#adb3bc">Rocket under parachute</text>
<rect x="25" y="291" width="1150" height="40" rx="8" fill="none" stroke="#2c333d" stroke-width="1.5"/>
<text x="600" y="316" text-anchor="middle" font-size="15" fill="#edeff2">5 V battery  ·  Arduino Nano board (timer)  ·  Servo and 3 LEDs</text>
