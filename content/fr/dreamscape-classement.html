  * { box-sizing: border-box; }
  html { background: var(--nuit); }
  body {
    margin: 0; padding-block: 28px 56px; padding-inline: 16px; color: var(--encre); overflow-x: hidden;
    background:
      radial-gradient(circle, rgba(255, 255, 255, 0.55) 0 1.2px, transparent 1.6px) 0 0 / 97px 89px,
      radial-gradient(circle, rgba(255, 255, 255, 0.35) 0 1px, transparent 1.4px) 40px 30px / 61px 71px,
      radial-gradient(ellipse at 50% 30%, var(--nuit-claire), var(--nuit) 75%) fixed, var(--nuit);
    font: 17px/1.5 Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif; min-height: 100vh;
  }
  /* Le parchemin des fenêtres du jeu (assets/ui/cadres/feuillet_orne.png, coins ornés, bords déchirés et roussis par la
     fabrique), en cadre à 9 parts ; la patine et le grain par-dessus, comme EngravedBox en jeu. */
  .feuillet {
    position: relative; isolation: isolate; max-width: 780px; margin: 6px auto 0; padding: 4px 6px 2px;
    border: 46px solid transparent;
    border-image: var(--parchemin) 136 fill / 72px / 26px round;
    filter: drop-shadow(0 14px 26px rgba(0, 0, 0, 0.55));
  }
  /* Le calque couvre tout le parchemin (bordure 46 + débord 26 = 72px) et prend sa forme déchirée : la même découpe que
     le cadre en masque ; sans ce masque (Firefox), ses bords s'estompent au lieu de s'arrêter sur un trait droit. */
  .feuillet::before {
    content: ""; position: absolute; inset: -72px; z-index: -1; pointer-events: none;
    background: var(--patine) 37% 12% / 520px, var(--grain);
    mix-blend-mode: multiply; opacity: 0.9;
    -webkit-mask-image: linear-gradient(90deg, transparent 30px, #000 64px, #000 calc(100% - 64px), transparent calc(100% - 30px)),
      linear-gradient(transparent 30px, #000 64px, #000 calc(100% - 64px), transparent calc(100% - 30px));
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(90deg, transparent 30px, #000 64px, #000 calc(100% - 64px), transparent calc(100% - 30px)),
      linear-gradient(transparent 30px, #000 64px, #000 calc(100% - 64px), transparent calc(100% - 30px));
    mask-composite: intersect;
  }
  @supports (-webkit-mask-box-image: none) {
    .feuillet::before { -webkit-mask-image: none; mask-image: none; -webkit-mask-box-image: var(--parchemin) 136 fill / 72px round; }
  }

  /* L'affiche du jeu (assets/icons/app/ecran_chargement.png, le titre en DREAMFONT), au-dessus du feuillet ; le titre est
     en bas de l'image : seul le dernier liseré se fond dans la nuit. */
  .affiche { max-width: 1180px; margin: -12px auto 0; }
  .affiche img {
    display: block; width: 100%; height: auto; border-radius: 10px;
    -webkit-mask-image: linear-gradient(#000 96%, transparent 100%); mask-image: linear-gradient(#000 96%, transparent 100%);
  }
  .cache { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  header { text-align: center; margin-bottom: 18px; }
  .filet-titre { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 0 auto; max-width: 560px; }
  .filet-titre::before, .filet-titre::after { content: ""; flex: 1; height: 5px; border-block: 1px solid var(--filet); opacity: 0.7;
    background: repeating-linear-gradient(-55deg, var(--filet) 0 1px, transparent 1px 4px); }
  .filet-titre span { font: 400 clamp(30px, 6vw, 42px)/1 var(--titre); color: var(--sanguine); letter-spacing: 0.02em; white-space: nowrap; }
  .filet-titre svg { width: 20px; height: 20px; fill: var(--or); stroke: #5a4128; stroke-width: 4; flex: none; }

  /* Les onglets : les boutons gravés du jeu (assets/ui/cadres/bouton.png, l'onglet ouvert : bouton_enfonce.png). */
  .onglets { display: flex; gap: 4px 6px; justify-content: center; flex-wrap: wrap; margin: 0 0 20px; padding: 0; }
  .onglets button {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer; min-height: 46px;

  .marche::after { content: ""; position: absolute; inset: -6px; z-index: -1; pointer-events: none;
    background: var(--patine) var(--patine-xy, 10% 60%) / 360px; mix-blend-mode: multiply; opacity: 0.75; }
  .marche.r1 { order: 2; padding-top: 22px; padding-bottom: 20px; animation-delay: 0.1s; --patine-xy: 70% 20%; }
  .marche.r2 { order: 1; animation-delay: 0.2s; --m-clair: #ffffff; --m: #abb3c2; --m-fonce: #3d4557; --patine-xy: 30% 80%; }
  .marche.r3 { order: 3; animation-delay: 0.3s; --m-clair: #ffd6a3; --m: #c27540; --m-fonce: #5e2b12; --patine-xy: 90% 45%; }
  @keyframes monte { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  /* Le guilloché du jeu, porté tel quel (assets/shaders/guilloche.gdshader, posé par RarityGleam) : un petit canvas WebGL
     par fiche, sur tout le bord de la fiche ; script « guilloche » plus bas. Il apparaît en fondu comme en jeu. */
  .guilloche { position: absolute; left: -16px; top: -16px; width: calc(100% + 32px); height: calc(100% + 32px);
    pointer-events: none; z-index: 1; display: block; animation: luit 0.5s ease-out both; }
  .r1 .guilloche { animation-delay: 0.15s; } .r2 .guilloche { animation-delay: 0.35s; } .r3 .guilloche { animation-delay: 0.55s; }
  @keyframes luit { from { opacity: 0; } }
  /* Repli sans WebGL : un cadre fixe aux trois tons du même métal (RarityGleam.METAUX : creux, ton, reflet). */
  .guilloche.fixe { border: 10px solid; border-image: linear-gradient(135deg, var(--m-fonce), var(--m) 30%, var(--m-clair) 50%, var(--m) 70%, var(--m-fonce)) 1;
    box-shadow: inset 0 0 0 1px var(--m-fonce), 0 0 0 1px var(--m-fonce); }
  .medaille { position: relative; width: 58px; height: 58px; margin: 0 auto 6px; }
  .r1 .medaille { width: 74px; height: 74px; }
  .medaille svg { width: 100%; height: 100%; overflow: visible; }
  .medaille .rang-num { position: absolute; inset: 0; display: grid; place-items: center; padding-top: 8%; font: 400 22px/1 var(--titre); color: var(--encre); }
  .r1 .medaille .rang-num { font-size: 28px; }
  .marche .pseudo { font-weight: bold; overflow-wrap: anywhere; line-height: 1.25; }
  .marche .valeur { margin-top: 4px; font: 400 26px/1.1 var(--titre); color: var(--sanguine); font-variant-numeric: tabular-nums; }
  .r1 .valeur { font-size: 32px; }

  .peuple { display: inline-flex; align-items: center; gap: 5px; margin-top: 3px; font-size: 13px; color: var(--encre-douce); }
  .peuple i { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--encre-pale)); box-shadow: 0 0 0 1px rgba(51, 37, 26, 0.3); flex: none; }

  /* La suite : chaque joueur sur sa bande de parchemin (les fiches du jeu, une sur deux plus foncée, comme en jeu). */
  ol.liste { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
  ol.liste li {
    position: relative; display: grid; grid-template-columns: 2.6em minmax(0, 1fr) auto; gap: 10px; align-items: center;

  /* La patine et le grain sur chaque bande, des taches différentes d'une bande à l'autre (comme les marches du podium). */
  ol.liste li::after { content: ""; position: absolute; inset: -6px; z-index: -1; pointer-events: none;
    background: var(--patine) var(--px, 20% 40%) / 300px, var(--grain); mix-blend-mode: multiply; opacity: 0.6; }
  ol.liste li:nth-child(3n+2) { --px: 75% 15%; } ol.liste li:nth-child(3n) { --px: 40% 85%; }
  ol.liste li:nth-child(6n+4) { --px: 90% 60%; }
  ol.liste li:nth-child(3n+1) { margin-inline: 0 4px; } ol.liste li:nth-child(3n+2) { margin-inline: 3px 1px; }
  ol.liste .rang { text-align: right; font: 400 21px/1 var(--titre); color: var(--encre-pale); font-variant-numeric: tabular-nums; }
  ol.liste .qui { min-width: 0; }
  ol.liste .pseudo { display: block; overflow-wrap: anywhere; }
  ol.liste .valeur { font: 400 20px/1 var(--titre); color: var(--sanguine); white-space: nowrap; font-variant-numeric: tabular-nums; }
  /* Un temps estimé (une partie commencée avant le chronomètre) : dans le même classement, en italique, d'une encre plus douce. */
  ol.liste li.estime .pseudo, ol.liste li.estime .valeur, .marche.estime .pseudo, .marche.estime .valeur { font-style: italic; color: var(--encre-douce); font-weight: normal; }
  .note.pied { margin-top: 14px; text-align: center; font-size: 14px; }

  .etat { text-align: center; color: var(--encre-douce); padding: 26px 0 18px; }
  .etat svg { width: 46px; height: 46px; fill: var(--velin-ombre); stroke: var(--filet); stroke-width: 2; display: block; margin: 0 auto 8px; }
  .etat strong { display: block; font: 400 22px/1.2 var(--titre); color: var(--encre); font-weight: 400; }
  .etat.brume svg { fill: #dfe3ea; stroke: var(--brume); }

  footer { margin-top: 26px; padding-top: 14px; border-top: 3px double rgba(122, 92, 60, 0.5); text-align: center; font-size: 14px; color: var(--encre-douce); }
  footer a { color: var(--sanguine); }

    .feuillet { padding: 0 6px; border-width: 26px; border-image-width: 46px; border-image-outset: 16px; }

    return ol;

  function etat(titre, texte, brume) {
    const box = el("div", { class: "etat" + (brume ? " brume" : "") });
    box.append(svg("-6 -6 112 112", '<use href="#etoile"/>'), el("strong", {}, titre));
    if (texte) box.append(document.createTextNode(texte));
    return box;
  }
  async function montrer(cat) {
    const n = ++demande;
    for (const b of onglets.children) b.setAttribute("aria-selected", b.dataset.cat === cat.id ? "true" : "false");
    const entete = el("div", { class: "entete-cat" });
    entete.append(el("h2", {}, cat.titre), el("p", { class: "note" }, cat.note));
    vue.replaceChildren(entete);
    if (!WORKER) { vue.append(etat("Bientôt ouvert", "Le classement en ligne n'est pas encore ouvert.")); return; }
    const attente = el("p", { class: "etat" }, "Lecture du classement…");
    vue.append(attente);
    try {
      const r = await fetch(`${WORKER}/classement?categorie=${cat.id}&n=50`);
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      if (n !== demande) return;
      attente.remove();
      // Un seul classement : les temps mesurés, puis les estimés (anciennes parties), dont les rangs continuent.
      const mesures = d.lignes || [];
      const lignes = mesures.concat((d.estimes || []).map(l => ({ ...l, estime: true, rang: mesures.length + l.rang }))).slice(0, 50);
      if (!lignes.length) {
        vue.append(cat.id === "ligue"
          ? etat("Personne pour l'instant", "La ligue de la semaine attend son premier rêveur. Gagnez une revanche contre un grand royaume, et la première place est à vous.")
          : cat.id === "trophees"
          ? etat("Personne pour l'instant", "Les Terres de brume s'ouvrent après la fin du rêve, une fois le Port des Nuages achevé. Le premier trophée vous attend !", true)
          : etat("Personne pour l'instant", "La première place vous attend."));
      }
      if (lignes.length) {
        if (cat.id === "ligue" && SONGES === "a" && palierDe(lignes[0].valeur) === 3) vue.append(el("div", { class: "place-flammes" }));
        vue.append(podium(cat.id, lignes));
        if (lignes.length > 3) vue.append(liste(cat.id, lignes.slice(3)));
        if (lignes.some(l => l.estime)) vue.append(el("p", { class: "note pied" }, "≈ : temps estimé, pour une partie commencée avant le chronomètre."));
      }
    } catch {
      if (n !== demande) return;
      attente.replaceWith(etat("Lecture impossible", "Le classement n'a pas pu être lu. Réessayez dans un moment."));
    }
  }
  for (const cat of CATEGORIES) {
    const b = el("button", { role: "tab", type: "button" });
    b.append(svg("0 0 24 24", ICONES[cat.id]), document.createTextNode(cat.onglet));
    b.dataset.cat = cat.id;
    b.addEventListener("click", () => montrer(cat));
    onglets.append(b);
  }
  const depart = CATEGORIES.find(c => c.id === location.hash.slice(1)) || CATEGORIES[0];
  montrer(depart);
</script>
