  .affiche { max-width: 1180px; margin: -12px auto 0; }
  .affiche img {
    display: block; width: 100%; height: auto; border-radius: 10px;
    -webkit-mask-image: linear-gradient(#000 62%, transparent 98%); mask-image: linear-gradient(#000 62%, transparent 98%);
  }
  .cache { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  header { text-align: center; margin-bottom: 22px; }
  h1 {
    margin: 0; font: 400 clamp(40px, 9vw, 64px)/1 var(--titre); color: var(--sanguine);
    letter-spacing: 0.02em; text-shadow: 0 2px 0 rgba(154, 59, 37, 0.12);
  }
  .sous-titre { margin: 4px 0 0; font-style: italic; color: var(--encre-douce); }
  .filet-titre { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 0 auto; max-width: 560px; }
  .filet-titre::before, .filet-titre::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--filet), transparent); }
  .filet-titre span { font: 400 clamp(30px, 6vw, 42px)/1 var(--titre); color: var(--sanguine); letter-spacing: 0.02em; white-space: nowrap; }
  .filet-titre svg { width: 20px; height: 20px; fill: var(--or); flex: none; }

  .onglets {
    display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 0 0 22px; padding: 0;
  }
  .onglets button {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    font: 400 18px/1 var(--titre); color: var(--encre); background: var(--velin);
    border: 1px solid var(--filet); border-radius: 999px; padding: 8px 14px 7px;
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.7) inset, 0 2px 3px rgba(51, 37, 26, 0.12);
    transition: background 0.15s, color 0.15s, transform 0.15s;
  }
  .onglets button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .onglets button:hover { transform: translateY(-1px); background: #fffaea; }
  .onglets button[aria-selected="true"] { background: var(--sanguine); border-color: var(--sanguine); color: var(--velin); }
  .onglets button:focus-visible { outline: 2px solid var(--or); outline-offset: 2px; }

  .entete-cat { text-align: center; margin-bottom: 18px; }
  h2 { margin: 0; font: 400 30px/1.1 var(--titre); color: var(--encre); text-wrap: balance; }
  .note { margin: 6px auto 0; max-width: 56ch; color: var(--encre-douce); font-size: 15px; }

  .podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: end; margin-bottom: 20px; }
  .marche {
    position: relative; min-width: 0; text-align: center; padding: 14px 10px 14px;
    background: linear-gradient(#fffaf0, var(--velin-fonce)); border: 1px solid var(--filet); border-radius: 6px;
    box-shadow: 0 3px 8px rgba(51, 37, 26, 0.15);
    animation: monte 0.5s ease-out both;
  }
  .marche.r1 { order: 2; padding-top: 22px; padding-bottom: 22px; border-color: var(--or); box-shadow: 0 0 0 2px rgba(201, 154, 46, 0.35), 0 6px 16px rgba(51, 37, 26, 0.22); animation-delay: 0.1s; }
  .marche.r2 { order: 1; animation-delay: 0.2s; }
  .marche.r3 { order: 3; animation-delay: 0.3s; }
  @keyframes monte { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .medaille { position: relative; width: 58px; height: 58px; margin: 0 auto 6px; }
  .r1 .medaille { width: 74px; height: 74px; }
  .medaille svg { width: 100%; height: 100%; overflow: visible; }
  .medaille .rang-num { position: absolute; inset: 0; display: grid; place-items: center; padding-top: 8%; font: 400 22px/1 var(--titre); color: var(--encre); }
  .r1 .medaille .rang-num { font-size: 28px; }
  .marche .pseudo { font-weight: bold; overflow-wrap: anywhere; line-height: 1.25; }
  .marche .valeur { margin-top: 4px; font: 400 26px/1.1 var(--titre); color: var(--sanguine); font-variant-numeric: tabular-nums; }
  .r1 .valeur { font-size: 32px; }

  .peuple { display: inline-flex; align-items: center; gap: 5px; margin-top: 3px; font-size: 13px; color: var(--encre-douce); }
  .peuple i { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--encre-pale)); box-shadow: 0 0 0 1px rgba(51, 37, 26, 0.3); flex: none; }

  ol.liste { list-style: none; margin: 0; padding: 0; border-top: 1px solid rgba(122, 92, 60, 0.35); }
  ol.liste li {
    display: grid; grid-template-columns: 3em minmax(0, 1fr) auto; gap: 10px; align-items: center;
    padding: 8px 6px; border-bottom: 1px solid rgba(122, 92, 60, 0.18); animation: monte 0.35s ease-out both;
  }
  ol.liste li:nth-child(odd) { background: rgba(236, 223, 192, 0.45); }
  ol.liste .rang { text-align: right; font: 400 19px/1 var(--titre); color: var(--encre-pale); font-variant-numeric: tabular-nums; }
  ol.liste .qui { min-width: 0; }
  ol.liste .pseudo { display: block; overflow-wrap: anywhere; }
  ol.liste .valeur { font-weight: bold; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .estimes li .pseudo, .estimes li .valeur { font-style: italic; color: var(--encre-douce); font-weight: normal; }
  h3 { margin: 26px 0 2px; font: 400 22px/1.2 var(--titre); color: var(--encre); text-align: center; }

  .etat { text-align: center; color: var(--encre-douce); padding: 26px 0 18px; }
  .etat svg { width: 46px; height: 46px; fill: var(--velin-ombre); stroke: var(--filet); stroke-width: 2; display: block; margin: 0 auto 8px; }
  .etat strong { display: block; font: 400 22px/1.2 var(--titre); color: var(--encre); font-weight: 400; }
  .etat.brume svg { fill: #dfe3ea; stroke: var(--brume); }

  footer { margin-top: 26px; padding-top: 14px; border-top: 1px solid rgba(122, 92, 60, 0.35); text-align: center; font-size: 14px; color: var(--encre-douce); }
  footer a { color: var(--sanguine); }

  @media (max-width: 560px) {
    .feuillet { padding: 0 8px; border-width: 26px; border-image-width: 46px; border-image-outset: 16px; }
    .onglets button { font-size: 16px; padding: 7px 11px 6px; }
    .podium { grid-template-columns: minmax(0, 1fr); gap: 8px; }
    .marche, .marche.r1 { order: 0; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; padding: 10px 12px; }
    .medaille, .r1 .medaille { width: 48px; height: 48px; margin: 0; }
    .medaille .rang-num, .r1 .medaille .rang-num { font-size: 19px; }
    .marche .valeur, .r1 .valeur { margin: 0; font-size: 24px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="affiche"><img src="/assets/img/dreamscape/dreamscape-classement-fond.jpg" width="1800" height="810" alt="Dreamscape, un royaume de rêve : un royaume gravé dans une boule à neige"></div>
<main class="feuillet">
  <header>
    <h1 class="cache">Dreamscape : classement</h1>
    <div class="filet-titre"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#etoile"/></svg><span>Le classement</span><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#etoile"/></svg></div>
  </header>
  <nav class="onglets" role="tablist" id="onglets" aria-label="Catégories"></nav>
  <section id="vue" aria-live="polite"></section>
  <footer>
    Pour y figurer : cochez « Participer au classement » dans les Options du jeu (elle l'est par défaut). Les scores arrivent au fil des parties.<br>
    <a href="/dreamscape-confidentialite/">Ce qui est envoyé, et comment l'effacer</a>
  </footer>
</main>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <path id="etoile" d="M47.5 0.0L45.1 0.5L41.5 3.0L39.9 10.9L38.3 16.1L33.9 24.3L29.5 29.2L22.1 35.8L15.3 41.0L10.4 43.4L7.1 44.3L2.7 46.7L0.0 49.5L0.0 52.5L1.1 56.8L4.1 60.1L10.1 60.9L13.7 59.8L16.7 59.8L25.7 63.4L39.9 76.5L43.7 81.7L46.4 87.2L50.0 89.3L55.5 89.9L58.2 86.9L59.6 86.6L60.7 85.2L62.3 80.6L66.4 73.0L72.4 66.4L76.2 64.5L78.4 64.2L81.7 62.6L86.3 62.0L92.3 62.6L96.4 61.7L100.0 59.0L100.0 54.6L97.0 47.8L88.8 42.3L82.8 39.9L70.8 30.6L65.3 25.1L61.5 19.4L59.6 14.5L58.7 9.3L57.1 5.5L53.0 1.6L50.8 0.5Z"/>
    <linearGradient id="g-or" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6dc85"/><stop offset="1" stop-color="#c08d22"/></linearGradient>
    <linearGradient id="g-argent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f3f6"/><stop offset="1" stop-color="#959ba5"/></linearGradient>
    <linearGradient id="g-bronze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eab083"/><stop offset="1" stop-color="#9a5a32"/></linearGradient>
  </defs>
</svg>

<script>
  const ICONES = {
    temps15: '<path d="M7 3h10M7 21h10M8 3c0 5 8 5 8 9s-8 4-8 9M16 3c0 5-8 5-8 9s8 4 8 9"/>',
    degats: '<path d="M5 19l9-9M14 4l6 0 0 6-9 9-6-6zM4 15l5 5M3 21l2-2"/>',
    medailles: '<circle cx="12" cy="15" r="5"/><path d="M8 3l4 7 4-7M12 13v4"/>',
    couronnes: '<path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/>',
    influence: '<path d="M6 21V3M6 4h11l-3 4 3 4H6"/>',
    trophees: '<path d="M3 10c3-2 5 2 9 0s6-2 9 0M3 15c3-2 5 2 9 0s6-2 9 0M6 6c2-1 4 1 6 0"/>',
  };
  const CATEGORIES = [
    { id: "temps15", onglet: "15 royaumes", titre: "Les 15 royaumes, au plus vite",
      note: "Le temps de jeu actif pour conquérir les 15 royaumes. Le plus court est en tête." },
    { id: "degats", onglet: "Dégâts", titre: "Les plus grands guerriers",
      note: "Tous les dégâts infligés en combat, toutes parties confondues." },
    { id: "medailles", onglet: "Défis", titre: "Médailles des défis",
      note: "Les médailles gagnées aux défis de la semaine, toutes semaines confondues." },
    { id: "couronnes", onglet: "Couronnes", titre: "Les trésors les plus riches", note: "Les Couronnes du trésor, à leur plus haut." },
    { id: "influence", onglet: "Influence", titre: "Les plus influents", note: "Le prestige gagné par l'influence, à son plus haut." },
    { id: "trophees", onglet: "Brume", titre: "Trophées de la Brume", note: "Les étoiles des trophées gagnés dans les Terres de brume." },
  ];
  const PEUPLES = {
    scientifique: ["Astronomes de l'Éther", "#3f6fb0"], ouvrier: ["Forges des Montagnes", "#b0502c"],
    universitaire: ["Citadelle des Sages", "#6d4f9e"], litteraire: ["Cité des Conteurs", "#a33a52"],
    naturel: ["Bois des Druides", "#4f8a3a"], marchand: ["Comptoirs du Levant", "#d39a2a"],
    mystique: ["Arcanes suspendues", "#4b4f9c"], nomade: ["Cavaliers des Steppes", "#b48a4a"],
  };
  const vue = document.getElementById("vue");
  const onglets = document.getElementById("onglets");
  let demande = 0;

  function el(tag, attrs = {}, texte = "") {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    if (texte) e.textContent = texte; // jamais innerHTML pour ce qui vient des joueurs
    return e;
  }
  function svg(vb, inner, cls) {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", vb); s.setAttribute("aria-hidden", "true");
    if (cls) s.setAttribute("class", cls);
    s.innerHTML = inner; // contenu fixe de la page, jamais des joueurs
    return s;
  }
  function duree(s) {
    const m = Math.round(s / 60);
    return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}`;
  }
  function valeur(cat, v, estime) {
    if (cat === "temps15") return estime ? `≈ ${duree(v)}` : duree(v);
    return Math.round(v).toLocaleString("fr-FR");
  }
  function peuple(id) {
    const p = PEUPLES[id];
    if (!p) return null;
    const s = el("span", { class: "peuple" });
    const i = el("i"); i.style.setProperty("--c", p[1]);
    s.append(i, document.createTextNode(p[0]));
    return s;
  }
  function podium(cat, lignes, estime) {
    const box = el("div", { class: "podium" });
    const teintes = ["or", "argent", "bronze"];
    lignes.slice(0, 3).forEach((l, i) => {
      const m = el("div", { class: `marche r${i + 1}` });
      const med = el("div", { class: "medaille" });
      med.append(svg("-6 -6 112 112", `<use href="#etoile" fill="url(#g-${teintes[i]})" stroke="#5a4128" stroke-width="3" stroke-linejoin="round"/>`),
        el("span", { class: "rang-num" }, String(l.rang)));
      const qui = el("div", { class: "qui" });
      qui.append(el("div", { class: "pseudo" }, l.pseudo));
      const p = peuple(l.peuple); if (p) qui.append(p);
      m.append(med, qui, el("div", { class: "valeur" }, valeur(cat, l.valeur, estime)));
      box.append(m);
    });
    return box;
  }
  function liste(cat, lignes, estime) {
    const ol = el("ol", { class: "liste" + (estime ? " estimes" : "") });
    lignes.forEach((l, i) => {
      const li = el("li"); li.style.animationDelay = `${Math.min(i, 12) * 0.03}s`;
      const qui = el("div", { class: "qui" });
      qui.append(el("span", { class: "pseudo" }, l.pseudo));
      const p = peuple(l.peuple); if (p) qui.append(p);
      li.append(el("span", { class: "rang" }, String(l.rang)), qui, el("span", { class: "valeur" }, valeur(cat, l.valeur, estime)));
      ol.append(li);
    });
    return ol;
  }
  function etat(titre, texte, brume) {
    const box = el("div", { class: "etat" + (brume ? " brume" : "") });
    box.append(svg("-6 -6 112 112", '<use href="#etoile"/>'), el("strong", {}, titre));
    if (texte) box.append(document.createTextNode(texte));
    return box;
  }
  async function montrer(cat) {
    const n = ++demande;
    for (const b of onglets.children) b.setAttribute("aria-selected", b.dataset.cat === cat.id ? "true" : "false");
    const entete = el("div", { class: "entete-cat" });
    entete.append(el("h2", {}, cat.titre), el("p", { class: "note" }, cat.note));
    vue.replaceChildren(entete);
    if (!WORKER) { vue.append(etat("Bientôt ouvert", "Le classement en ligne n'est pas encore ouvert.")); return; }
    const attente = el("p", { class: "etat" }, "Lecture du classement…");
    vue.append(attente);
    try {
      const r = await fetch(`${WORKER}/classement?categorie=${cat.id}&n=50`);
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      if (n !== demande) return;
      attente.remove();
      const lignes = d.lignes || [], estimes = d.estimes || [];
      if (!lignes.length && !estimes.length) {
        vue.append(cat.id === "trophees"
          ? etat("Bientôt", "Les Terres de brume s'ouvriront avec une prochaine version du jeu.", true)
          : etat("Personne pour l'instant", "La première place vous attend."));
      }
      if (lignes.length) {
        vue.append(podium(cat.id, lignes, false));
        if (lignes.length > 3) vue.append(liste(cat.id, lignes.slice(3), false));
      }
      if (estimes.length) {
        vue.append(el("h3", {}, "Anciennes parties, temps estimé"),
          el("p", { class: "note", style: "text-align:center" }, "Commencées avant le chronomètre : le temps est estimé d'après ce que le royaume a produit."),
          podium(cat.id, estimes, true));
        if (estimes.length > 3) vue.append(liste(cat.id, estimes.slice(3), true));
      }
    } catch {
      if (n !== demande) return;
      attente.replaceWith(etat("Lecture impossible", "Le classement n'a pas pu être lu. Réessayez dans un moment."));
    }
  }
  for (const cat of CATEGORIES) {
    const b = el("button", { role: "tab", type: "button" });
    b.append(svg("0 0 24 24", ICONES[cat.id]), document.createTextNode(cat.onglet));
    b.dataset.cat = cat.id;
    b.addEventListener("click", () => montrer(cat));
    onglets.append(b);
  }
  const depart = CATEGORIES.find(c => c.id === location.hash.slice(1)) || CATEGORIES[0];
  montrer(depart);
</script>
